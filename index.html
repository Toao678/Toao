<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Toao v3.0</title>
<style>
:root {
  --bg: #0f1115;
  --card: #1a1d23;
  --border: #2a2d35;
  --text: #e8eaed;
  --text-dim: #8b90a0;
  --red: #ef4444;
  --orange: #f59e0b;
  --blue: #3b82f6;
  --green: #22c55e;
  --purple: #8b5cf6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); 
  color: var(--text); 
  line-height: 1.5; 
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* 顶部广告栏 */
.top-banner {
  background: rgba(26, 29, 35, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  color: white;
  box-shadow: 0 2px 8px rgba(239,68,68,0.3);
}
.app-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.app-version {
  font-size: 10px;
  color: var(--text-dim);
  margin-left: 4px;
}
.header-actions {
  display: flex;
  gap: 12px;
  font-size: 18px;
  margin: 0 12px;
}
.register-btn {
  background: linear-gradient(135deg, #f59e0b, #ea580c);
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(245,158,11,0.3);
}

/* 主容器 */
.container { 
  max-width: 480px; 
  margin: 0 auto; 
  padding: 12px; 
  padding-bottom: 80px;
}

/* 模型选择器 */
.model-selector {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 14px;
}
.model-label { color: var(--text-dim); }
.model-name { font-weight: 600; flex: 1; }
.model-rate { color: var(--green); font-size: 12px; font-weight: 600; }

/* 工具栏 */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.btn-tool {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  white-space: nowrap;
}
.btn-tool:active { background: var(--border); transform: scale(0.98); }
.btn-scan { color: var(--blue); }
.btn-model { color: var(--purple); }
.btn-lock { color: var(--orange); }
.btn-freeze { color: var(--green); }

/* 卡片 */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* 主显示区 */
.main-display {
  display: flex;
  gap: 16px;
}
.left-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.section-title {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 开奖球 */
.balls-container {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.ball {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 16px;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.3);
}
.ball.r { background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); color: white; }
.ball.g { background: radial-gradient(circle at 30% 30%, #4ade80, #15803d); color: white; }
.ball.b { background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); color: white; }

.issue-info {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.sum-info {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
}
.timer-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.timer-progress {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 1s linear;
}

/* 预测网格 */
.pred-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.pred-btn {
  background: rgba(59, 130, 246, 0.1);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--blue);
  cursor: pointer;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.pred-btn.active {
  background: rgba(59, 130, 246, 0.2);
  border-color: var(--blue);
  font-weight: 600;
}
.pred-kill {
  margin-top: 10px;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 8px;
  padding: 8px;
  text-align: center;
  font-size: 13px;
  color: var(--red);
  font-weight: 600;
}

/* 统计 */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat-item {
  background: rgba(255,255,255,0.03);
  border-radius: 10px;
  padding: 10px;
}
.stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.stat-value { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
.stat-bar {
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
}
.stat-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* 回测表格 */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { 
  text-align: left; 
  color: var(--text-dim); 
  font-weight: 500; 
  padding: 8px 4px; 
  border-bottom: 1px solid var(--border); 
}
td { 
  padding: 8px 4px; 
  border-bottom: 1px solid rgba(42,45,53,0.5); 
  color: var(--text-dim);
}
.tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10px;
  margin-right: 2px;
}
.tag-da { background: rgba(59,130,246,0.2); color: var(--blue); }

/* 底部操作栏 */
.action-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin: 0 auto;
  background: rgba(15, 17, 21, 0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  border-top: 1px solid var(--border);
  z-index: 100;
}
.btn-primary {
  flex: 1;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(37,99,235,0.3);
}
.btn-secondary {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 底部文字 */
.footer-text {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 16px;
  line-height: 1.8;
}

/* 加载动画 */
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.loading { animation: pulse 1.5s infinite; }
</style>
</head>
<body>
<div class="top-banner">
  <div class="logo-area">
    <div class="logo-icon">慢</div>
    <div><span class="app-title">Toao</span><span class="app-version">v3.0</span></div>
  </div>
  <div class="header-actions"><span onclick="toggleTheme()">🌙</span><span>📞</span></div>
  <button class="register-btn" onclick="window.open('https://toao.vip','_blank')">立即注册</button>
</div>

<div class="container">
  <div class="model-selector">
    <span class="model-label">🎯 模型</span>
    <span class="model-name" id="modelName">模型 3847</span>
    <span class="model-rate" id="modelRate">匹配率 --%</span>
  </div>

  <div class="toolbar">
    <button class="btn-tool btn-scan" onclick="scan()">🔍 扫描</button>
    <button class="btn-tool btn-model" onclick="switchModel()">🎲 选模型</button>
    <button class="btn-tool btn-lock" onclick="toggleLock()">🔒 锁定</button>
    <button class="btn-tool btn-freeze" onclick="toggleFreeze()">❄️ 冻结</button>
    <button class="btn-tool btn-scan" onclick="dualGroup()">📊 双组</button>
  </div>

  <div class="card">
    <div class="main-display">
      <div class="left-panel">
        <div class="section-title">🟢 开奖</div>
        <div class="balls-container" id="balls">
          <div class="ball r">-</div>
          <div class="ball g">-</div>
          <div class="ball g">-</div>
        </div>
        <div class="issue-info" id="issueInfo">-- 期</div>
        <div class="sum-info" id="sumInfo">和值: -- / --</div>
        <div class="timer-bar"><div class="timer-progress" id="timerBar"></div></div>
      </div>
      <div class="right-panel">
        <div class="section-title" style="justify-content:space-between"><span>🧊 预测</span><span style="color:var(--blue);font-size:11px" id="nextIssue">--</span></div>
        <div class="pred-grid" id="predGrid">
          <div class="pred-btn active" id="p1">组1<br>--</div>
          <div class="pred-btn" id="p2">组2<br>--</div>
          <div class="pred-btn" id="p3">组3<br>--</div>
        </div>
        <div class="pred-kill" id="pKill">🚫 杀组 --</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">📊 四组汇总</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:13px;font-weight:700">📂 近30期回测</span><span class="model-rate" id="btRate">--</span></div>
    <table>
      <thead><tr><th>期号</th><th>开奖</th><th>预测</th><th>实际</th><th>结果</th></tr></thead>
      <tbody id="btBody"></tbody>
    </table>
  </div>

  <div class="footer-text">
    数据真实可查 · 仅供娱乐<br>
    🐶旺旺:373494538 🛰️微信:langzi057 ✈️飞机@ZG023<br>Toao祝大家捞顺发
  </div>
</div>

<div class="action-bar">
  <button class="btn-primary" onclick="predict()">✨ 预测</button>
  <button class="btn-secondary" onclick="scan()">🔄 刷新</button>
</div>

<script>
// 配置
const API_URL = '/api/yu28'; // 修改为你的本地代理接口
const TYPES = ["大单","大双","小单","小双"];

// DOM 元素
var els = {
  balls: document.getElementById('balls'),
  issueInfo: document.getElementById('issueInfo'),
  sumInfo: document.getElementById('sumInfo'),
  timerBar: document.getElementById('timerBar'),
  predGrid: document.getElementById('predGrid'),
  p1: document.getElementById('p1'),
  p2: document.getElementById('p2'),
  p3: document.getElementById('p3'),
  pKill: document.getElementById('pKill'),
  nextIssue: document.getElementById('nextIssue'),
  statsGrid: document.getElementById('statsGrid'),
  btBody: document.getElementById('btBody'),
  modelName: document.getElementById('modelName'),
  modelRate: document.getElementById('modelRate'),
  btRate: document.getElementById('btRate')
};

// 工具函数
function getSum(nums) {
  return nums.reduce(function(a,b){return a+b;},0);
}

function getType(sum) {
  if(sum >= 0 && sum <= 13) return sum % 2 === 1 ? "小单" : "小双";
  if(sum >= 14 && sum <= 27) return sum % 2 === 1 ? "大单" : "大双";
  return "--";
}

// 获取数据
async function fetchData() {
  try {
    var res = await fetch(API_URL);
    if(!res.ok) throw new Error('网络请求失败');
    var data = await res.json();
    if(data && data.length > 0) {
      render(data);
    }
  } catch(e) {
    console.error('Fetch error:', e);
    // 如果接口挂了，显示模拟数据用于UI调试
    var mock = generateMockData(50);
    render(mock);
  }
}

// 渲染数据
function render(data) {
  if(!data || data.length === 0) return;
  
  var latest = data[0];
  var prevComb = latest.combination || getType(getSum((latest.number||"0+0+0").split("=")[0].split("+").map(Number)));
  
  // 更新开奖球
  var nums = (latest.number||"0+0+0").split("=")[0].split("+");
  els.balls.innerHTML = nums.map(function(n, i) {
    var cls = i === 0 ? 'r' : (i === 1 ? 'g' : 'g');
    return '<div class="ball ' + cls + '">' + n + '</div>';
  }).join('');
  
  els.issueInfo.textContent = latest.nbr + ' 期';
  var sum = getSum(nums.map(Number));
  els.sumInfo.textContent = '和值: ' + sum + ' / ' + (latest.combination||getType(sum));
  
  // 预测逻辑
  var idx = TYPES.indexOf(prevComb);
  if(idx > -1) {
    var preds = [TYPES[(idx+1)%4], TYPES[(idx+2)%4], TYPES[(idx+3)%4]];
    els.p1.innerHTML = "组1<br>" + preds[0];
    els.p2.innerHTML = "组2<br>" + preds[1];
    els.p3.innerHTML = "组3<br>" + preds[2];
    var kill = TYPES.find(function(x){return !preds.includes(x)}) || "--";
    els.pKill.textContent = "🚫 杀组 " + kill;
    els.nextIssue.textContent = (parseInt(latest.nbr)+1) + ' 期';
  }
  
  // 统计
  var c = {"大单":0,"大双":0,"小单":0,"小双":0};
  data.forEach(function(r){
    var n = (r.number||"0+0+0").split("=")[0].split("+").map(Number);
    var s = getSum(n);
    var t = r.combination || getType(s);
    if(c[t] !== undefined) c[t]++;
  });
  var total = data.length;
  var map = [["s1","大单",c["大单"],"#ef4444"],["s2","大双",c["大双"],"#f59e0b"],["s3","小单",c["小单"],"#3b82f6"],["s4","小双",c["小双"],"#22c55e"]];
  els.statsGrid.innerHTML = map.map(function(m){
    return '<div class="stat-item '+m[0]+'"><div class="stat-label">'+m[1]+'</div><div class="stat-value" style="color:'+m[3]+'">'+m[2]+'</div><div class="stat-bar"><div class="stat-bar-fill" style="background:'+m[3]+';width:'+(total?Math.round(m[2]/total*100):0)+'%"></div></div></div>';
  }).join("");

  // 回测
  var correct = 0;
  els.btBody.innerHTML = data.slice(0,30).map(function(cur,i){
    var pr = data[i+1];
    var hit = false;
    var preds = ["-","-","-"];
    if(pr) {
      var pn = (pr.number||"0+0+0").split("=")[0].split("+").map(Number);
      var ps = getSum(pn);
      var pc = pr.combination || getType(ps);
      var pidx = TYPES.indexOf(pc);
      if(pidx > -1) {
        preds = [TYPES[(pidx+1)%4], TYPES[(pidx+2)%4], TYPES[(pidx+3)%4]];
        var cn = (cur.number||"0+0+0").split("=")[0].split("+").map(Number);
        var cs = getSum(cn);
        var cc = cur.combination || getType(cs);
        hit = preds.includes(cc);
      }
    }
    if(hit) correct++;
    return '<tr><td>'+cur.nbr+'</td><td>'+cur.number+'</td><td>'+preds.map(function(p){return '<span class="tag tag-da">'+p+'</span>'}).join(" ")+'</td><td>'+cur.combination+'</td><td>'+(pr?(hit?'<span style="color:#22c55e">✅</span>':'<span style="color:#ef4444">❌</span>'):"-")+'</td></tr>';
  }).join("");
  els.modelRate.textContent = "匹配率 " + (correct/Math.max(data.length-1,1)*100).toFixed(1) + "%";
  els.btRate.textContent = "匹配率 " + (correct/Math.max(data.length-1,1)*100).toFixed(1) + "%";
}

// 模拟数据生成（备用）
function generateMockData(count) {
  var arr = [];
  var baseNbr = 3471613;
  for(var i=0; i<count; i++) {
    var n1 = Math.floor(Math.random()*10);
    var n2 = Math.floor(Math.random()*10);
    var n3 = Math.floor(Math.random()*10);
    var sum = n1+n2+n3;
    var comb = getType(sum);
    arr.push({
      nbr: baseNbr - i,
      number: n1+"+"+n2+"+"+n3+"="+sum,
      combination: comb
    });
  }
  return arr;
}

// 交互功能
function toggleTheme() {
  var body = document.body;
  if(body.style.filter === "invert(1) hue-rotate(180deg)") {
    body.style.filter = "";
  } else {
    body.style.filter = "invert(1) hue-rotate(180deg)";
  }
}

function predict() { fetchData(); }
function scan() { fetchData(); }
function switchModel() { 
  var models = ["3847", "1923", "5566", "8848"];
  var current = els.modelName.textContent.replace("模型 ","");
  var idx = models.indexOf(current);
  var next = models[(idx+1)%models.length];
  els.modelName.textContent = "模型 " + next;
}
function toggleLock() { alert("已锁定当前模型"); }
function toggleFreeze() { alert("已冻结当前预测"); }
function dualGroup() { alert("双组模式已开启"); }

// 启动
fetchData();
setInterval(fetchData, 45000);
</script>
</body>
</html>
